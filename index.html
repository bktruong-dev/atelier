<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atelier</title>
    <meta name="description" content="A browser instrument for mathematical patterns." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  </head>
  <body>
    <header class="masthead">
      <h1>Atelier</h1>
      <nav id="presets" aria-label="Patterns"></nav>
    </header>
    <main class="stage">
      <figure class="figure">
        <canvas id="canvas" aria-label="Pattern canvas"></canvas>
        <figcaption id="caption"></figcaption>
      </figure>
      <aside class="panel">
        <section>
          <h2>Dials</h2>
          <div id="dials"></div>
        </section>
        <section>
          <h2>Formula</h2>
          <pre id="formula"></pre>
        </section>
      </aside>
    </main>
    <footer id="timeline" class="timeline"></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
